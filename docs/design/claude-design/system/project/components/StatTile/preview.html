<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>StatTile</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&amp;display=swap">
<style>
.pv { padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.pv-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.pv-note { font: 400 12px/16px var(--font-sans); color: var(--ink-3); margin: 0; }

</style>
</head>
<body>
<div class="mm pv">
<div class="mm-stats"><div class="mm-stat"><span class="mm-stat__label">Ingreso</span><span class="mm-stat__value">$5,140</span><span class="mm-stat__delta"><svg class="ic ic-16 st-serious" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10"/><path d="M17 7v10H7"/></svg>2% menos</span></div><div class="mm-stat"><span class="mm-stat__label">Gasto</span><span class="mm-stat__value">$2,263</span><span class="mm-stat__delta"><svg class="ic ic-16 st-good" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10"/><path d="M17 7v10H7"/></svg>9% menos</span></div><div class="mm-stat"><span class="mm-stat__label">Ahorro neto</span><span class="mm-stat__value">$2,877</span><span class="mm-stat__delta"><svg class="ic ic-16 st-good" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>4% más</span></div></div>
</div>
</body>
</html>
