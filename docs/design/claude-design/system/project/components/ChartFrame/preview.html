<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>ChartFrame</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&amp;display=swap">
<style>
.pv { padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.pv-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.pv-note { font: 400 12px/16px var(--font-sans); color: var(--ink-3); margin: 0; }

</style>
</head>
<body>
<div class="mm pv">
<section class="mm-chart"><div class="mm-chart__head"><div><h3 class="mm-chart__title">Gasto por categoría</h3><p class="mm-chart__sub">1–15 oct · toca una barra para ver subcategorías</p></div><button class="mm-iconbtn" type="button" aria-label="Ver como tabla"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2V9M9 21H5a2 2 0 0 1-2-2V9m0 0h18"/></svg></button></div><ul class="mm-barlist"><li><span class="mm-barlist__name">Renta</span><span class="mm-barlist__val">$1,150.00</span><span class="mm-barlist__fill" style="width:100%"></span></li><li><span class="mm-barlist__name">Súper</span><span class="mm-barlist__val">$412.35</span><span class="mm-barlist__fill" style="width:35.9%"></span></li><li><span class="mm-barlist__name">Servicios</span><span class="mm-barlist__val">$197.40</span><span class="mm-barlist__fill" style="width:17.2%"></span></li><li><span class="mm-barlist__name">Otros</span><span class="mm-barlist__val">$121.25</span><span class="mm-barlist__fill mm-barlist__fill--muted" style="width:10.5%"></span></li></ul></section>
<section class="mm-chart"><div class="mm-chart__head"><div><h3 class="mm-chart__title">Quién pagó</h3><p class="mm-chart__sub">1–15 oct</p></div><button class="mm-iconbtn" type="button" aria-label="Ver como tabla"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2V9M9 21H5a2 2 0 0 1-2-2V9m0 0h18"/></svg></button></div><div class="mm-stack100" role="img" aria-label="Tú 52%, {pareja} 38%, Hogar 10%"><span class="mm-seg-a" style="width:52%"></span><span class="mm-seg-b" style="width:38%"></span><span class="mm-seg-joint" style="width:10%"></span></div><div class="mm-legend"><span class="mm-legend__item"><span class="mm-dot mm-dot--a"></span>Tú <span class="tnum">$1,172.45 · 52%</span></span><span class="mm-legend__item"><span class="mm-dot mm-dot--b"></span>{pareja} <span class="tnum">$864.62 · 38%</span></span><span class="mm-legend__item"><span class="mm-dot mm-dot--joint"></span>Hogar <span class="tnum">$226.33 · 10%</span></span></div></section>
</div>
</body>
</html>
