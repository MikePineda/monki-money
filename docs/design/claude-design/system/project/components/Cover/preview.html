<!doctype html>
<html lang="en">
<head>

<title>monkimoney</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&amp;display=swap">
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--surface-0); color: var(--ink-1); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .accent { fill: var(--accent); }
  .soft { fill: var(--accent-soft); }
  .deep { fill: var(--ink-1); }
  .pa { fill: var(--person-a); }
  .pb { fill: var(--person-b); }
  .muted { fill: var(--mark-muted); }
  .mark { fill: var(--mark-neutral); }
  .rule { stroke: var(--line); stroke-width: 1; }
  .blk { rx: var(--radius-lg); }
  .words { position: absolute; left: var(--space-6); right: var(--space-6); bottom: var(--space-6); max-width: 440px; }
  .name { margin: 0; font-size: 72px; line-height: 0.95; font-weight: 600; letter-spacing: -0.02em; color: var(--ink-1); }
  .tag { margin: var(--space-2) 0 0 2px; font-size: 14px; line-height: 20px; color: var(--ink-2); }

<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      accent 144x232 bled off the top (the one hue the brand is known by) · accent-soft 200x168 (the selection wash) · ink-1 120x216 bled off the right edge (expense is ink) · person-a / person-b / mark-muted as one 24px stacked bar (two people, one household) - about 33% of 960x288
  arrangement one tall accent slab with satellites, block bottoms on one line, space-4 gutters
  pattern     the literal motif: five 12px horizontal bars with 4px rounded data-ends in mark-neutral (the bar list every month is read from), plus three gridline hairlines in line; chosen because the product's signature is a chart drawn to the dataviz rules
  scales      sides in space-2 multiples; gutters space-4; bar pitch 28 (12 + space-4); block corners radius-lg; bar data-ends radius-sm; segment gaps 2px
-->
<line class="rule" x1="160" y1="96" x2="480" y2="96"/>
<line class="rule" x1="160" y1="152" x2="480" y2="152"/>
<line class="rule" x1="160" y1="208" x2="480" y2="208"/>

<rect class="pa" x="0" y="240" width="208" height="24"/>
<rect class="pb" x="210" y="240" width="152" height="24"/>
<rect class="muted" x="364" y="240" width="116" height="24"/>
</svg>
</div>

<p class="tag">A calm financial editor for two.</p>
</div>
