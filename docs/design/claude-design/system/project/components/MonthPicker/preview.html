<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>MonthPicker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&amp;display=swap">
<style>
.pv { padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.pv-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.pv-note { font: 400 12px/16px var(--font-sans); color: var(--ink-3); margin: 0; }

</style>
</head>
<body>
<div class="mm pv">
<div class="mm-months" role="tablist" aria-label="Mes"><button class="mm-month" role="tab" type="button">may</button><button class="mm-month" role="tab" type="button">jun</button><button class="mm-month" role="tab" type="button">jul</button><button class="mm-month" role="tab" type="button">ago</button><button class="mm-month" role="tab" type="button">sep</button><button class="mm-month mm-month--on" role="tab" aria-selected="true" type="button">oct</button><button class="mm-month mm-month--future" type="button" disabled>nov</button></div>
</div>
</body>
</html>
