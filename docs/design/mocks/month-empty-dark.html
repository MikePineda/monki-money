<div class="w-12 h-12 rounded-xl bg-[#1e2320] flex items-center justify-center text-[#bbbfbc]">

</div>

</div>
<button class="px-4 py-2 rounded-lg border border-[#6b706d] text-body-sm font-medium text-[#ecefed] bg-[#151816] hover:bg-[#1e2320] transition-all">Import CSV</button>
