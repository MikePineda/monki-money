version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      adonisjs:
        patterns: ['@adonisjs/*', '@japa/*', '@vinejs/*', '@tuyau/*']
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', 'angular-eslint']
      tooling:
        patterns: ['*']
        exclude-patterns:
          [
            '@adonisjs/*',
            '@japa/*',
            '@vinejs/*',
            '@tuyau/*',
            '@angular/*',
            '@angular-devkit/*',
            'angular-eslint',
          ]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
