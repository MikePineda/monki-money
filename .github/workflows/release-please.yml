# Opens/updates the release PR on every push to main. Merging that PR bumps
# package.json, writes CHANGELOG.md, tags vX.Y.Z and creates a GitHub Release.
# RELEASE_PLEASE_TOKEN (fine-grained PAT: Contents + Pull requests write) is
# preferred so the release PR triggers CI; GITHUB_TOKEN works as a fallback
# but PRs opened with it do not run workflows.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
