# CI guards merges; it never deploys. Dokploy builds and deploys on merge to
# main (ARM64, on the server), so there is no `docker build` here: the
# faithful rehearsal is `docker build --target runtime .` on an ARM Mac.
# Required checks (ruleset on main): `ci` and `commitlint`. No path filters on
# purpose: a required check that does not run blocks the PR forever.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# commitlint and gitleaks list the pull request's commits through the API.
permissions:
  contents: read
  pull-requests: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  NG_CLI_ANALYTICS: 'false'

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: monkimoney
          POSTGRES_PASSWORD: monkimoney
          POSTGRES_DB: monkimoney_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monkimoney -d monkimoney_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Same values as apps/api/.env.test; listed so the job is self-describing.
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: monkimoney
      DB_PASSWORD: monkimoney
      DB_DATABASE: monkimoney_test
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_BUCKET: monkimoney-test
      S3_KEY: monkimoney
      S3_SECRET: monkimoney-secret
      S3_FORCE_PATH_STYLE: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Only used by the S3 integration tests (tests/integration/s3_storage.spec.ts,
      # added with the storage work package). Bitnami's frozen MinIO build:
      # upstream minio/minio images are no longer published.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=monkimoney -e MINIO_ROOT_PASSWORD=monkimoney-secret \
            bitnamilegacy/minio:2025.7.23-debian-12-r5
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:9000/minio/health/live && break
            sleep 1
          done
          docker run --rm --network host --entrypoint /bin/sh \
            bitnamilegacy/minio-client:2025.7.21-debian-12-r3 -c \
            'until mc alias set local http://127.0.0.1:9000 monkimoney monkimoney-secret >/dev/null; do sleep 1; done && mc mb --ignore-existing local/monkimoney-test'

      - run: npm ci

      # `node ace codegen` boots the app, so start/env.ts must validate. CI has
      # no .env: create it exactly like a fresh clone does (tests still load
      # .env.test on top of it).
      - name: Prepare apps/api/.env
        run: cp apps/api/.env.example apps/api/.env && (cd apps/api && node ace generate:key)

      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Tuyau contract is in sync (run `npm run codegen` and commit apps/api/.adonisjs)
        run: npx turbo run codegen && git diff --exit-code -- apps/api/.adonisjs

      - name: Lint, typecheck, test, build
        run: npx turbo run lint typecheck test build --continue

      - name: npm audit (non-blocking)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  commitlint:
    name: commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.mjs

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Non-blocking until it proves stable; then add `e2e` to the ruleset.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # `node ace codegen` boots the app, so start/env.ts must validate. CI has
      # no .env: create it exactly like a fresh clone does (tests still load
      # .env.test on top of it).
      - name: Prepare apps/api/.env
        run: cp apps/api/.env.example apps/api/.env && (cd apps/api && node ace generate:key)

      - name: Install Playwright Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: E2E (mobile-chromium)
        run: npx turbo run e2e -- --project=mobile-chromium

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  # The Bruno collection (apps/api/bruno) as living API docs: every route has
  # a request (bruno:coverage) and the full tier passes against the same
  # stack the e2e job boots (docker-compose.test.yml, slot 0: API 3334,
  # Postgres 5433, MinIO 9100), seeded by `seed:e2e`. Not a required check
  # yet: add `bruno` to the ruleset once it proves stable.
  bruno:
    name: bruno
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_API_PORT: 3334
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Every route has a Bruno request
        run: npm run bruno:coverage

      # `node ace codegen` boots the app, so start/env.ts must validate. CI has
      # no .env: create it exactly like a fresh clone does.
      - name: Prepare apps/api/.env
        run: cp apps/api/.env.example apps/api/.env && (cd apps/api && node ace generate:key)

      # Only the API: the collection never loads the SPA.
      - name: Build the API
        run: npx turbo run build --filter=@monkimoney/api

      # The steps of scripts/e2e.sh for slot 0, without Playwright.
      - name: Start Postgres and MinIO (docker-compose.test.yml)
        run: |
          docker compose -f docker-compose.test.yml up -d --wait db minio
          docker compose -f docker-compose.test.yml run --rm minio-init

      - name: Copy the fake LLM fixtures into the API build
        run: |
          mkdir -p apps/api/build/tests/fixtures
          cp -R apps/api/tests/fixtures/llm apps/api/build/tests/fixtures/llm

      - name: Migrate, seed and start the API
        run: |
          set -a
          source e2e/e2e.env
          set +a
          export PORT="$E2E_API_PORT" APP_URL="http://127.0.0.1:$E2E_API_PORT"
          export DB_PORT=5433 S3_ENDPOINT=http://127.0.0.1:9100
          cd apps/api/build
          node ace migration:run --force
          node ace seed:e2e
          nohup node bin/server.js >"$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS "http://127.0.0.1:$E2E_API_PORT/api/health/live" && exit 0
            sleep 1
          done
          echo "the API did not answer in 60 s" >&2
          cat "$RUNNER_TEMP/api.log" >&2
          exit 1

      # Both tiers with `bru run --env local` against the E2E API, as the E2E
      # seed's synthetic owner (scripts/smoke.sh e2e).
      - name: Bruno full tier
        run: bash scripts/smoke.sh e2e --reporter-html "$RUNNER_TEMP/bruno-report.html"

      - name: Upload the Bruno report and API log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: bruno-report
          path: |
            ${{ runner.temp }}/bruno-report.html
            ${{ runner.temp }}/api.log
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: docker compose -f docker-compose.test.yml down -v --remove-orphans
