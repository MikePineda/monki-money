# Ephemeral stack for `npm run e2e` (scripts/e2e.sh brings it up and tears it
# down with -v). Different ports from docker-compose.yml so both can run at
# once, and no named volumes: data lives in tmpfs and dies with the stack.
name: monkimoney-test

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: monkimoney
      POSTGRES_PASSWORD: monkimoney
      POSTGRES_DB: monkimoney_e2e
    ports:
      - '127.0.0.1:5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U monkimoney -d monkimoney_e2e']
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      MINIO_ROOT_USER: monkimoney
      MINIO_ROOT_PASSWORD: monkimoney-secret
    ports:
      - '127.0.0.1:9100:9000'
      - '127.0.0.1:9101:9001'
    tmpfs:
      - /bitnami/minio/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9000/minio/health/live']
      interval: 2s
      timeout: 3s
      retries: 30

  minio-init:
    image: bitnamilegacy/minio-client:2025.7.21-debian-12-r3
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command:
      - >
        until mc alias set local http://minio:9000 monkimoney monkimoney-secret >/dev/null; do sleep 1; done &&
        mc mb --ignore-existing local/monkimoney-e2e
    restart: 'no'
